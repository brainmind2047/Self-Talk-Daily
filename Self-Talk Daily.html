<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Self-Talk Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a single-column daily journal; sticky tab bar; the book's daily score scale is the signature control. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --ink:#1f2340; --muted:#5e6382; --line:#dfe2ec;
  --accent:#5a3f8f; --accent-soft:#ebe4f6; --saffron:#c9811a;
  --z-green:#2f8a5f; --z-yellow:#b7861c; --z-red:#b5474b;
  --z-green-soft:#e2f2ea; --z-yellow-soft:#f6eedb; --z-red-soft:#f6e3e3;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13152a; --surface:#1c1f38; --ink:#e8e9f4; --muted:#a3a7c4; --line:#2e3254;
  --accent:#c4abf2; --accent-soft:#2f2650; --saffron:#e6a64a;
  --z-green:#5cc493; --z-yellow:#e2b552; --z-red:#ea7f83;
  --z-green-soft:#1d3a30; --z-yellow-soft:#3a321c; --z-red-soft:#3e2228; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13152a; --surface:#1c1f38; --ink:#e8e9f4; --muted:#a3a7c4; --line:#2e3254;
  --accent:#c4abf2; --accent-soft:#2f2650; --saffron:#e6a64a;
  --z-green:#5cc493; --z-yellow:#e2b552; --z-red:#ea7f83;
  --z-green-soft:#1d3a30; --z-yellow-soft:#3a321c; --z-red-soft:#3e2228; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
h1{font:400 1.7rem/1.15 var(--f-display);margin:0;text-wrap:balance}
h2{font:400 1.35rem/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.save{font-size:.82rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:600 .92rem var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.daynum{font:500 .85rem var(--f-mono);color:var(--saffron);letter-spacing:.04em}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.why{color:var(--muted);margin:4px 0 12px}
ol.steps{margin:0 0 12px;padding-left:22px;display:grid;gap:4px}
.example{border-left:3px solid var(--saffron);padding:6px 12px;margin:0 0 12px;font-style:italic;color:var(--muted)}
.action{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.action b{color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.scale button{height:46px;border:1px solid transparent;border-radius:5px;cursor:pointer;font:500 .78rem var(--f-mono);padding:0;min-width:0}
.scale button.g{background:var(--z-green-soft);color:var(--z-green)}
.scale button.y{background:var(--z-yellow-soft);color:var(--z-yellow)}
.scale button.r{background:var(--z-red-soft);color:var(--z-red)}
.scale button[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;font-weight:700}
.scale-ends{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.mood-read{min-height:1.5em;font-weight:600;margin-top:6px}
.mood-read small{font-weight:400;color:var(--muted)}
.moods{display:grid;gap:16px}
ul.checks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:6px;cursor:pointer}
ul.checks label:hover{background:var(--accent-soft)}
ul.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.when{font:500 .7rem var(--f-mono);color:var(--saffron);min-width:62px;margin-top:3px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical}
.progressline{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progressline span{display:block;height:100%;background:var(--accent);width:0}
.weeks{display:grid;gap:14px}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcell{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;cursor:pointer;display:grid;gap:2px;min-width:0}
.dcell .n{font:500 .72rem var(--f-mono);color:var(--muted)}
.dcell .t{font-weight:600;font-size:.9rem;line-height:1.3}
.dcell.done{border-color:var(--z-green);background:var(--z-green-soft)}
.dcell.done .n{color:var(--z-green)}
.dcell.current{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tk{display:grid;gap:10px}
.tool{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tool summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool .num{font:500 .8rem var(--f-mono);color:var(--saffron);min-width:28px}
.tool .nm{font-weight:600;flex:1;min-width:0}
.tool .rg{font:500 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.tool .body{padding:0 14px 14px 52px}
.tool .body p{margin:0 0 8px;color:var(--muted)}
.filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;max-width:100%}
.res-list{display:grid;gap:8px}
.res-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.res-item b{display:block;margin-bottom:2px}
.callout{border:1px solid var(--line);background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat .v{font:400 1.6rem/1 var(--f-display)}
.stat .l{font-size:.78rem;color:var(--muted);margin-top:4px}
.chartbox{overflow-x:auto}
svg text{font-family:var(--f-body)}
table.areas{width:100%;border-collapse:collapse;font-size:.92rem}
table.areas th,table.areas td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.areas td.ch{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.note{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){
  .scale.wide{grid-template-columns:repeat(11,minmax(0,1fr))}
  .stats{grid-template-columns:1fr 1fr}
  .tool .body{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1 id="app-title"></h1>
    <span class="save" id="save-status">Loading your progress…</span>
  </header>
  <p class="sub" id="app-sub"></p>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" id="tab-plan" aria-selected="false" data-tab="plan">30-Day Plan</button>
    <button role="tab" id="tab-toolkit" aria-selected="false" data-tab="toolkit">Toolkit</button>
    <button role="tab" id="tab-rescue" aria-selected="false" data-tab="rescue">Rescue</button>
    <button role="tab" id="tab-progress" aria-selected="false" data-tab="progress">Progress</button>
  </nav>

  <section class="panel" id="p-today" role="tabpanel" aria-labelledby="tab-today">
    <div class="card">
      <div class="daybar">
        <div>
          <div class="daynum" id="t-daynum"></div>
          <h2 id="t-title"></h2>
        </div>
        <div class="row">
          <button class="btn" id="t-prev" aria-label="Previous day">‹</button>
          <button class="btn" id="t-next" aria-label="Next day">›</button>
        </div>
      </div>
      <div class="row" style="margin-top:4px"><span class="pill" id="t-meta"></span></div>
      <p class="why" id="t-why"></p>
      <h3>Today's task</h3>
      <ol class="steps" id="t-steps"></ol>
      <p class="example" id="t-example"></p>
      <div class="action" id="t-action"></div>
    </div>

    <div class="card moods" id="scores"></div>

    <div class="card">
      <h3>Daily routine</h3>
      <div class="progressline" aria-hidden="true"><span id="chk-bar"></span></div>
      <p class="note" id="chk-count" style="margin:6px 0 8px"></p>
      <ul class="checks" id="checks"></ul>
    </div>

    <div class="card">
      <h3><label for="notes">My notes for today</label></h3>
      <textarea id="notes"></textarea>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <span class="note" id="done-note"></span>
        <button class="btn primary" id="mark-done">Mark day complete</button>
      </div>
    </div>
  </section>

  <section class="panel" id="p-plan" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <div class="card">
      <h2>Your 30 days</h2>
      <p class="why">Four weeks, each building on the last. Tap a day to open its card.</p>
      <div class="weeks" id="weeks"></div>
    </div>
  </section>

  <section class="panel" id="p-toolkit" role="tabpanel" aria-labelledby="tab-toolkit" hidden>
    <div class="card">
      <h2 id="tk-title"></h2>
      <p class="why" id="tk-intro"></p>
      <div class="filter">
        <label for="tk-group">Show</label>
        <select id="tk-group"></select>
      </div>
    </div>
    <div class="tk" id="tk"></div>
  </section>

  <section class="panel" id="p-rescue" role="tabpanel" aria-labelledby="tab-rescue" hidden>
    <div class="card">
      <h2>Rescue guide</h2>
      <p class="why" id="rs-intro"></p>
      <div class="filter">
        <label for="rs-sel">Right now</label>
        <select id="rs-sel"></select>
      </div>
    </div>
    <div class="res-list" id="rs-out"></div>
    <div class="callout" id="rs-callout"></div>
  </section>

  <section class="panel" id="p-progress" role="tabpanel" aria-labelledby="tab-progress" hidden>
    <div class="stats" id="stats"></div>
    <div class="card">
      <h3 id="chart-title"></h3>
      <p class="note" id="chart-note" style="margin:0 0 8px"></p>
      <div class="chartbox" id="chart"></div>
    </div>
    <div class="card">
      <h3>Day 1 vs Day 30 by life area</h3>
      <p class="note" id="areas-note" style="margin:0 0 8px"></p>
      <div class="tablewrap"><table class="areas" id="areas"></table></div>
    </div>
  </section>
</div>
